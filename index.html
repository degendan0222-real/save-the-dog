<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Save the Doge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #FDF2F8;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      position: fixed;
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    #ui {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    #start-screen {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #E0F7FA 0%, #B3E5FC 40%, #E1F5FE 100%);
      z-index: 10;
      transition: opacity 0.4s;
    }
    #start-icon {
      font-size: 72px; margin-bottom: 4px;
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    #start-title {
      font-family: 'Kalam', cursive;
      font-size: 40px; font-weight: 700;
      color: #EC4899;
      text-shadow: 2px 2px 0 rgba(139,92,246,0.15);
      text-align: center;
    }
    #start-sub {
      font-family: 'Patrick Hand', cursive;
      font-size: 16px; color: #7C3AED;
      text-align: center; margin: 4px 0 20px; opacity: 0.8;
    }
    #start-btn {
      font-family: 'Kalam', cursive; font-weight: 700;
      font-size: 24px; color: #FFFFFF;
      background: linear-gradient(135deg, #EC4899, #8B5CF6);
      padding: 12px 44px; border: none; border-radius: 50px;
      cursor: pointer; pointer-events: auto;
      box-shadow: 0 4px 0 #7C3AED, 0 8px 24px rgba(139,92,246,0.3);
      transition: transform 0.1s;
      letter-spacing: 1px;
    }
    #start-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7C3AED, 0 8px 24px rgba(139,92,246,0.3); }

    #hud {
      position: absolute; top: 0; left: 0; width: 100%;
      padding: 8px 12px; display: none;
      justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 5;
    }
    .hud-left, .hud-right { display: flex; flex-direction: column; gap: 1px; }
    .hud-center { display: flex; flex-direction: column; align-items: center; }
    #lives { font-size: 16px; line-height: 1.2; }
    #level { font-family: 'Patrick Hand', cursive; font-size: 13px; color: #7C3AED; }
    #score { font-family: 'Kalam', cursive; font-weight: 700; font-size: 15px; color: #8B5CF6; }
    #timer-wrap {
      background: rgba(139,92,246,0.08);
      border-radius: 14px; padding: 3px 14px;
      border: 2px solid rgba(139,92,246,0.15);
    }
    #timer-label { font-family: 'Patrick Hand', cursive; font-size: 9px; color: #8B5CF6; letter-spacing: 1px; text-align: center; }
    #timer { font-family: 'Kalam', cursive; font-weight: 700; font-size: 26px; color: #EC4899; text-align: center; line-height: 1; }
    #stars-display { font-size: 14px; margin-top: 1px; }

    #ink-bar-bg {
      position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
      width: 180px; height: 14px; background: rgba(236,72,153,0.08);
      border-radius: 10px; border: 2px solid #FCE7F3; overflow: hidden;
      pointer-events: none; z-index: 5; display: none;
      box-shadow: inset 0 2px 4px rgba(236,72,153,0.1);
    }
    #ink-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #EC4899, #F59E0B); border-radius: 8px; transition: width 0.05s; }
    #ink-bar-label {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      font-family: 'Patrick Hand', cursive; font-size: 9px; color: #A78BFA; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
    }

    #draw-hint {
      position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%);
      font-family: 'Patrick Hand', cursive; font-size: 16px;
      color: #FFFFFF; text-shadow: 0 2px 6px rgba(0,0,0,0.15);
      text-align: center; pointer-events: none; z-index: 5;
      background: linear-gradient(135deg, #EC4899, #8B5CF6);
      padding: 7px 20px; border-radius: 18px; white-space: nowrap;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 3px 10px rgba(139,92,246,0.2);
    }
    #draw-hint.hidden { display: none; }

    #message {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Kalam', cursive; font-weight: 700; font-size: 26px;
      color: #FFFFFF; text-shadow: 2px 2px 0 rgba(139,92,246,0.3);
      text-align: center; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; z-index: 20; line-height: 1.5; white-space: pre-line;
      background: rgba(139,92,246,0.12);
      padding: 16px 28px; border-radius: 20px;
      backdrop-filter: blur(6px);
      border: 2px solid rgba(255,255,255,0.15);
    }
    #message.show { opacity: 1; }

    #restart-btn {
      font-family: 'Kalam', cursive; font-weight: 700; font-size: 20px;
      color: #FFFFFF; background: linear-gradient(135deg, #F59E0B, #EC4899);
      padding: 10px 32px; border: none; border-radius: 50px;
      cursor: pointer; pointer-events: auto; display: none; z-index: 25;
      position: absolute; top: 60%; left: 50%; transform: translateX(-50%);
      box-shadow: 0 4px 0 #B45309, 0 8px 20px rgba(245,158,11,0.3);
    }
    #restart-btn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #B45309, 0 8px 20px rgba(245,158,11,0.3); }

    #final-score {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Patrick Hand', cursive; font-size: 17px;
      color: rgba(255,255,255,0.85); text-align: center; z-index: 20;
      display: none; white-space: pre-line; line-height: 1.8;
    }

    @media (max-width: 400px) {
      #start-title { font-size: 32px; }
      #start-btn { padding: 10px 36px; font-size: 20px; }
      #start-icon { font-size: 56px; }
      #timer { font-size: 22px; }
      #message { font-size: 22px; padding: 12px 20px; }
      #ink-bar-bg { width: 150px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="start-screen">
      <div id="start-icon">🐶</div>
      <div id="start-title">Save the Doge</div>
      <div id="start-sub">draw a protective line · save the doge!</div>
      <button id="start-btn">▶ Play!</button>
    </div>

    <div id="hud">
      <div class="hud-left">
        <div id="lives">❤️❤️❤️</div>
        <div id="level">Level 1</div>
      </div>
      <div class="hud-center">
        <div id="timer-wrap">
          <div id="timer-label">time</div>
          <div id="timer">10</div>
        </div>
        <div id="stars-display"></div>
      </div>
      <div class="hud-right">
        <div id="score">🐝 0</div>
      </div>
    </div>

    <div id="ink-bar-bg">
      <div id="ink-bar-label">ink</div>
      <div id="ink-bar-fill"></div>
    </div>

    <div id="draw-hint">✏️ Draw a line to protect the doge!</div>
    <div id="message"></div>
    <div id="final-score"></div>
    <button id="restart-btn">▶ Play Again</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
